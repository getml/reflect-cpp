name: linux

on: [ push, pull_request ]

env: 
    VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        format: ["JSON", "AVRO", "BOOST_SERIALIZATION", "CAPNPROTO", "CBOR", "CEREAL", "FLEXBUFFERS", "MSGPACK", "PARQUET", "TOML", "UBJSON", "XML", "YAML", "benchmarks", "headers"]
        compiler: [llvm, gcc]
        compiler-version: [11, 12, 13, 14, 15, 16, 17, 18, 19]
        cxx: [20, 23]
        modules: ["OFF", "ON"]
        exclude:
          - compiler: llvm
            compiler-version: 16
            modules: "ON"
          - compiler: llvm
            compiler-version: 17
            modules: "ON"
          - compiler: llvm
            compiler-version: 18
            modules: "ON"
          - compiler: gcc
            compiler-version: 11
            modules: "ON"
          - compiler: gcc
            compiler-version: 12
            modules: "ON"
          - compiler: gcc
            compiler-version: 13
            modules: "ON"
          - compiler: gcc
            compiler-version: 14
            modules: "ON"
          # Keep the matrix below GitHub's 256-job limit: GCC 14 covers headers,
          # while GCC 15 covers the minimum supported module compiler.
          - compiler: gcc
            compiler-version: 15
            modules: "OFF"
          - compiler: gcc 
            compiler-version: 16
          - compiler: gcc 
            compiler-version: 17
          - compiler: gcc 
            compiler-version: 18
          - compiler: gcc
            compiler-version: 19
          - compiler: llvm
            compiler-version: 15
          - compiler: llvm
            compiler-version: 11
          - compiler: llvm 
            compiler-version: 12
          - compiler: llvm 
            compiler-version: 13
          - compiler: llvm 
            compiler-version: 14
          - compiler: gcc
            compiler-version: 11
            cxx: 23 
          - compiler: gcc
            compiler-version: 12
            cxx: 23  
          - compiler: llvm 
            compiler-version: 16
            cxx: 23 
          - compiler: llvm
            compiler-version: 17
            cxx: 23  
    name: "${{ github.job }} (${{ matrix.format }}-C++${{ matrix.cxx }}-${{ matrix.compiler }}-${{ matrix.compiler-version }}-modules-${{ matrix.modules }})"
    concurrency:
      group: "linux-${{ github.ref }}-${{ github.job }}-${{ matrix.format }}-C++${{ matrix.cxx }}-${{ matrix.compiler }}-${{ matrix.compiler-version }}-modules-${{ matrix.modules }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
      - name: Set up Python for benchmark tooling
        if: matrix.format == 'benchmarks'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use CMake 3.31.6 for the pinned benchmark port
        if: matrix.format == 'benchmarks'
        shell: bash
        run: |
          python -m pip install cmake==3.31.6
          python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          sudo apt update
          if [[ "${{ matrix.compiler-version }}" == 11 ]]; then
            sudo apt install -y ninja-build g++-11 
          elif [[ "${{ matrix.compiler }}" == "gcc" && "${{ matrix.compiler-version }}" == 15 ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt update
            sudo apt install -y ninja-build g++-15
          elif [[ "${{ matrix.compiler }}" == "llvm" && "${{ matrix.compiler-version }}" == 19 ]]; then
            sudo apt install -y ninja-build clang-19 clang-tools-19
          else
            sudo apt install -y ninja-build
          fi
      - name: Compile
        run: |
          if [[ "${{ matrix.compiler }}" == "llvm" ]]; then
            export CC=clang-${{ matrix.compiler-version }}
            export CXX=clang++-${{ matrix.compiler-version }}
          elif [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            export CC=gcc-${{ matrix.compiler-version }}
            export CXX=g++-${{ matrix.compiler-version }}
          fi
          $CXX --version
          if [[ "${{ matrix.format }}" == "JSON" ]]; then
            cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DREFLECTCPP_BUILD_MODULES=${{ matrix.modules }} -DREFLECTCPP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          elif [[ "${{ matrix.format }}" == "benchmarks" ]]; then
            cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DREFLECTCPP_BUILD_MODULES=${{ matrix.modules }} -DREFLECTCPP_BUILD_BENCHMARKS=ON -DREFLECTCPP_ALL_FORMATS=ON -DCMAKE_BUILD_TYPE=Release
          elif [[ "${{ matrix.format }}" == "headers" ]]; then
            cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DREFLECTCPP_BUILD_MODULES=${{ matrix.modules }} -DREFLECTCPP_CHECK_HEADERS=ON -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DREFLECTCPP_BUILD_MODULES=${{ matrix.modules }} -DREFLECTCPP_BUILD_TESTS=ON -DREFLECTCPP_JSON=OFF -DREFLECTCPP_${{ matrix.format }}=ON -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build -j4
      - name: Run tests
        if: (matrix.format != 'benchmarks') && (matrix.format != 'headers')
        run: |
          ctest --test-dir build --output-on-failure
      - name: Run benchmarks 
        if: matrix.format == 'benchmarks' 
        run: |
          echo '# Benchmarks' >> $GITHUB_STEP_SUMMARY 
          echo '## Benchmarks across different formats' >> $GITHUB_STEP_SUMMARY 
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=canada_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=canada_write >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=licenses_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=licenses_write >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=person_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=person_write >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Benchmarks for JSON' >> $GITHUB_STEP_SUMMARY 
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=person_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=canada >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=licenses >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
